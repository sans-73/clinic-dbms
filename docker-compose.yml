# Starts a local MySQL 8.4 for the project.  Command: docker compose up -d
# Track B changes (see docs/pooling/CR_LOG_TRACK_B.md CR-B3):
#   --log-bin-trust-function-creators=1  -> stored functions/triggers can be created while the binary log is ON
#   --event-scheduler=ON                 -> lets the (disabled-by-default) MySQL EVENTs run when you enable them
services:
  mysql:
    image: mysql:8.4
    container_name: clinic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: clinic_db
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/db:ro          # lets us run SQL files inside the container
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
      - --log-bin-trust-function-creators=1
      - --event-scheduler=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
